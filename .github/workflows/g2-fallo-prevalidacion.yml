name: G2 - Fallo de prevalidación
"on":
  workflow_dispatch:
  push:
    branches: [scenario/group2]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Registrar cambio reciente
        run: |
          mkdir -p evidence
          git log -2 --oneline | tee evidence/commit-history.txt
          git show HEAD:.github/workflows/g2-fallo-prevalidacion.yml > evidence/workflow-config.yml
      - name: Validar configuración del servicio
        shell: bash
        env:
          SERVICE_BASE_URL: ${{ vars.SERVICE_BASE_URL }}
          SERVICE_ENDPOINT: https://matricula.internal.invalid
        run: |
          set -o pipefail
          {
            echo "Workflow started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Stage: Validate configuration"
            if [ -z "$SERVICE_BASE_URL" ]; then
              echo "ERROR: Required configuration variable SERVICE_BASE_URL was not found."
              echo "An endpoint is available as SERVICE_ENDPOINT, but the validator requires SERVICE_BASE_URL."
              echo "Dependency installation and automated tests were not started."
              exit 1
            fi
            echo "Configuration found."
          } 2>&1 | tee evidence/prevalidation-output.txt
      - name: Conservar evidencia de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G2-evidencia-prevalidacion
          path: evidence/
          if-no-files-found: warn
