name: G2 - Fallo de prevalidación
"on":
  workflow_dispatch:
  push:
    branches: [scenario/group2]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Validar configuración del servicio
        shell: bash
        env:
          LAB_SERVICE_ENDPOINT: ${{ vars.LAB_SERVICE_ENDPOINT }}
        run: |
          if [ -z "$LAB_SERVICE_ENDPOINT" ]; then
            echo "ERROR: falta configurar LAB_SERVICE_ENDPOINT."
            echo "La ejecución se detiene antes de iniciar las pruebas."
            exit 1
          fi
          echo "Configuración encontrada."
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: python -m pytest -q tests
