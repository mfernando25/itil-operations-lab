name: Apply ITIL Operations Lab v0.2.0 upgrade
"on":
  push:
    paths:
      - 'upgrade/part-*.b64'
permissions:
  contents: write
jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and validate upgrade
        shell: bash
        run: |
          cat upgrade/part-*.b64 > /tmp/itil-lab.b64
          base64 --decode /tmp/itil-lab.b64 > /tmp/itil-lab.tar.gz
          gzip -t /tmp/itil-lab.tar.gz
          mkdir -p /tmp/itil-upgrade
          tar -xzf /tmp/itil-lab.tar.gz -C /tmp/itil-upgrade
          test -f /tmp/itil-upgrade/itil-operations-lab/app.py
          test -f /tmp/itil-upgrade/itil-operations-lab/lab/evidence.py
          find /tmp/itil-upgrade/itil-operations-lab -mindepth 1 -maxdepth 1 ! -name .github -exec cp -a {} . \;
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile project
        run: python -m compileall -q lab tests scripts
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Publish v0.2.0 after successful verification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf upgrade
          git add -A
          git commit -m "Upgrade ITIL Operations Lab to v0.2.0"
          git push origin HEAD:main
