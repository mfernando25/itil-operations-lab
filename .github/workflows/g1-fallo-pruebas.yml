name: G1 - Fallo de pruebas
"on":
  workflow_dispatch:
  push:
    branches: [scenario/group1]
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Registrar commit y archivos modificados
        run: |
          mkdir -p evidence
          git rev-parse --short HEAD | tee evidence/workflow-revision.txt
          git log -2 --oneline -- scenario_tests/group1/updated_service_logic.py scenario_tests/group1/test_regression.py | tee evidence/commit-history.txt
          git show --stat --oneline "$(git log -1 --format=%H -- scenario_tests/group1/updated_service_logic.py scenario_tests/group1/test_regression.py)" | tee evidence/changed-files.txt
      - name: Ejecutar prueba de regresión
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q scenario_tests/group1 --junitxml=evidence/test-results.xml 2>&1 | tee evidence/test-output.txt
      - name: Conservar evidencia de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G1-evidencia-ejecucion
          path: evidence/
          if-no-files-found: warn
