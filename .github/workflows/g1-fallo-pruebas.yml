name: G1 - Fallo de pruebas
"on":
  workflow_dispatch:
  push:
    branches: [scenario/group1]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar prueba de regresión
        run: python -m pytest -q scenario_tests/group1
